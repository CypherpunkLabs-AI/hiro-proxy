# Phase 1: build the public source, push its image, pin the resulting digest in
# tinfoil-config.yml, and create the immutable release tag.
name: Tinfoil Release

run-name: Release ${{ inputs.version || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example, v0.1.0)"
        required: true
        type: string

concurrency:
  group: tinfoil-container-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and source
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          package_version=$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" {
              gsub(/["[:space:]]/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          version=${REQUESTED_VERSION:-v${package_version}}

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must have the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ "$version" != "v${package_version}" ]]; then
            echo "::error::Requested version $version does not match Cargo.toml version v${package_version}"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "refs/tags/$version" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=sha,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prepare-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Pin the image digest and create the release tag
        uses: tinfoilsh/update-container-action@5e0a3789316941664cee055706799114e0180565 # v0.6.0
        with:
          version: ${{ needs.prepare.outputs.version }}
          source-sha: ${{ needs.prepare.outputs.source_sha }}
          update-config: true
          image-refs: |
            ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch measurement and publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
