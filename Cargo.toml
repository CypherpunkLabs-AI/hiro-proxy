[package]
name = "hiro-proxy"
version = "0.1.5"
edition = "2024"
rust-version = "1.94.1"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
aws-sdk-s3 = { version = "1.145.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"] }
axum = { version = "0.8", features = ["http2", "json", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
governor = "0.10.4"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "2"
confidential-client = { package = "tinfoil", version = "=0.2.0", git = "https://github.com/tinfoilsh/tinfoil-rs", rev = "91e8aef8fbc34129b68de8667ece5bd9ef7b7110" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "limit", "request-id", "sensitive-headers", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
