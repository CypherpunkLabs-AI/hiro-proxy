[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "The transitive rsa crate is used by the Tinfoil SEV attestation verifier for public-certificate verification, not private-key RSA operations; the reported timing attack targets private-key recovery and has no patched release." },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/tinfoilsh/tinfoil-rs",
  "https://github.com/tinfoilsh/encrypted-http-body-protocol",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []
