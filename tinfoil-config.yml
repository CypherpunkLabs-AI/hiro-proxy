# Tinfoil Container configuration. Replace OWNER/REPO and every REPLACE_ value
# before the first release. The release workflow replaces the image reference
# with the immutable digest it builds.
cvm-version: 0.11.0
cpus: 2
memory: 8192

containers:
  - name: "hiro-proxy"
    image: "ghcr.io/cypherpunklabs-ai/hiro-proxy@sha256:f6c2cbbcd1a882c561f31ae53b4e2d86929e0cde13e7eb147e40fdf0abb3971a" # v0.1.9
    networks: [web]
    env:
      - APP_BIND_ADDR: "0.0.0.0:8080"
      - AUTH_ISSUER: "https://clerk.cypherpunklabs.io"
      - AUTH_AUTHORIZED_PARTIES: "https://hiro.cypherpunklabs.io,https://frontend-web-wine-ten.vercel.app"
      - WEBAUTHN_RP_ORIGIN: "https://cypherpunklabs.io"
      - LOG_JSON: "true"
    secrets:
      - DATABASE_URL
      - INFERENCE_API_KEY
      - CACHE_NAMESPACE_KEY
      - INFERENCE_SYSTEM_PROMPT
      - CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_USAGE_QUEUE_ID
      - CLOUDFLARE_QUEUES_API_TOKEN
      - USAGE_HMAC_SECRET
      - STRIPE_SECRET_KEY
      - R2_ENDPOINT
      - R2_BUCKET
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
    read_only: true
    tmpfs:
      /tmp: "size=64m,noexec,nosuid,nodev"
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: "on-failure"
    stop_signal: "SIGTERM"
    stop_timeout: 30

networks:
  web:
    egress: open

shim:
  upstream-port: 8080
  paths:
    - /health/*
    - /v1/*
    - /v3/*
